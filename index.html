'use strict';

// Logical coordinates only: 400 units wide, positive y points down.
const logicStates = new WeakMap();

function init(S) {
  const vh = Number.isFinite(S.vh) && S.vh > 0 ? S.vh : 600;
  S.mode = 'start';
  S.t = 0;
  S.p = { x: 184, y: 0, w: 32, h: 40, vx: 0, vy: 0, chao: true };
  S.plats = [{ x: 140, y: 40, w: 120, h: 12, tipo: 'fixa', vx: 0, quebrada: false }];
  S.camY = -vh / 3;
  S.alturaMax = 0;
  S.estagio = 0;
  logicStates.set(S, { breaks: new Map() });
  logicGenerate(S);
  return S;
}

function logicGenerate(S) {
  const vh = S.vh > 0 ? S.vh : 600;
  let prev = S.plats.reduce((a, b) => a.y < b.y ? a : b);
  while (prev.y > S.camY - Math.max(200, vh / 2)) {
    const difficulty = Math.min(1, Math.max(0, -prev.y) / 8000);
    // The nominal gap approaches 140; cap at 130 for a safe reachable chain.
    const gap = Math.min(130, 60 + 80 * difficulty);
    const w = 110 - 55 * difficulty;
    const center = prev.x + prev.w / 2;
    const x = Math.max(0, Math.min(400 - w, center - w / 2 + (Math.random() * 2 - 1) * 90));
    const r = Math.random();
    const special = 0.06 + 0.48 * difficulty;
    const tipo = r < special / 3 ? 'movel' : r < special * 2 / 3 ? 'quebra' : r < special ? 'mola' : 'fixa';
    prev = { x, y: prev.y - gap, w, h: 12, tipo,
      vx: tipo === 'movel' ? (Math.random() < 0.5 ? -1 : 1) * (30 + 15 * difficulty) : 0,
      quebrada: false };
    S.plats.push(prev);
  }
}

function update(S, dt, input = {}) {
  if (S.mode !== 'play' || !Number.isFinite(dt) || dt <= 0) return S;
  let state = logicStates.get(S);
  if (!state) {
    state = { breaks: new Map() };
    logicStates.set(S, state);
  }
  // Substeps prevent tunnelling, including spring jumps and long frames.
  const count = Math.ceil(Math.min(dt, 0.25) * 120);
  const step = Math.min(dt, 0.25) / count;
  for (let i = 0; i < count && S.mode === 'play'; i++) {
    S.t += step;
    const p = S.p;
    for (const [plat, remaining] of state.breaks) {
      const next = remaining - step;
      if (next <= 1e-9) { plat.quebrada = true; state.breaks.delete(plat); }
      else state.breaks.set(plat, next);
    }
    for (const plat of S.plats) {
      if (plat.tipo !== 'movel' || plat.quebrada) continue;
      plat.x += plat.vx * step;
      if (plat.x < 0) { plat.x = -plat.x; plat.vx = Math.abs(plat.vx); }
      if (plat.x + plat.w > 400) { plat.x = 800 - 2 * plat.w - plat.x; plat.vx = -Math.abs(plat.vx); }
    }
    p.vx = ((input.dir ? 1 : 0) - (input.esq ? 1 : 0)) * 220;
    if (input.pulo && p.chao) { p.vy = -700; p.chao = false; }
    const oldBottom = p.y + p.h;
    p.x += p.vx * step;
    // Wrap the whole sprite only after it leaves the screen.
    if (p.x > 400) p.x = -p.w + (p.x - 400);
    if (p.x + p.w < 0) p.x = 400 + p.x + p.w;
    p.vy += 1800 * step;
    p.y += p.vy * step;
    p.chao = false;
    if (p.vy > 0) {
      let landing = null;
      for (const plat of S.plats) {
        const overlaps = p.x + p.w > plat.x && p.x < plat.x + plat.w;
        if (!plat.quebrada && overlaps && oldBottom <= plat.y + 1e-7 && p.y + p.h >= plat.y &&
            (!landing || plat.y < landing.y)) landing = plat;
      }
      if (landing) {
        p.y = landing.y - p.h;
        p.vy = landing.tipo === 'mola' ? -1100 : 0;
        p.chao = landing.tipo !== 'mola';
        if (landing.tipo === 'quebra' && !state.breaks.has(landing)) state.breaks.set(landing, 0.3);
      }
    }
    S.alturaMax = Math.max(S.alturaMax, -p.y);
    S.estagio = S.alturaMax >= 5000 ? 2 : S.alturaMax >= 2000 ? 1 : 0;
    const vh = S.vh > 0 ? S.vh : 600;
    S.camY = Math.min(S.camY, p.y - vh / 3);
    if (p.y > S.camY + vh) { S.mode = 'over'; break; }
    logicGenerate(S);
    S.plats = S.plats.filter(plat => {
      const keep = !plat.quebrada && plat.y <= S.camY + vh + 80;
      if (!keep) state.breaks.delete(plat);
      return keep;
    });
  }
  return S;
}

if (typeof module !== 'undefined' && module.exports) module.exports = { init, update };

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const S={},input={esq:false,dir:false,pulo:false},SPR={},names=['Inferno','Terra','Céu'];
const palettes=[['#210d20','#6b2637','#ffb15c'],['#142b31','#426b54','#ead398'],['#344c80','#97c5d1','#fff0c6']];
for(const [key,src] of Object.entries(SPR_SRC)){const img=new Image();img.src=src;SPR[key]=img;}
function sprite(c,s,x,y,w,h,fallback){if(s&&s.complete&&s.naturalWidth)c.drawImage(s,x,y,w,h);else{c.fillStyle=fallback;c.fillRect(x,y,w,h);}}
function draw(c,S,w,h,SPR){
 const scale=w/400,vh=h/scale,stage=S.estagio||0,pal=palettes[stage];
 c.save();c.scale(scale,scale);c.imageSmoothingEnabled=false;
 const gradient=c.createLinearGradient(0,0,0,vh);gradient.addColorStop(0,pal[0]);gradient.addColorStop(1,pal[1]);c.fillStyle=gradient;c.fillRect(0,0,400,vh);
 const bg=SPR['fundo'+stage];if(bg&&bg.complete&&bg.naturalWidth){const tileH=400*bg.naturalHeight/bg.naturalWidth,offset=((-S.camY*.16)%tileH+tileH)%tileH;c.globalAlpha=.65;for(let y=offset-tileH;y<vh;y+=tileH)c.drawImage(bg,0,y,400,tileH);c.globalAlpha=1;}
 c.fillStyle=pal[2];c.globalAlpha=.22;for(let i=0;i<32;i++){const y=((i*83+S.camY*.1)%vh+vh)%vh;c.fillRect((i*137+29)%400,y,2,2);}c.globalAlpha=1;
 for(const p of S.plats||[]){if(p.quebrada)continue;const y=p.y-S.camY;if(y>vh+20||y< -40)continue;const colors={fixa:'#ad7779',movel:'#75cbd0',quebra:'#db9763',mola:'#c1df7d'};sprite(c,SPR[p.tipo],p.x,y,p.w,p.h,colors[p.tipo]||'#fff');}
 const p=S.p;if(p){const key=['demonio','humano','anjo'][stage];sprite(c,SPR[key],p.x,p.y-S.camY,p.w,p.h,pal[2]);}
 c.restore();
}
let viewW=400,viewH=600,last=0;
function resize(){const rect=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2);viewW=rect.width;viewH=rect.height;canvas.width=Math.round(viewW*ratio);canvas.height=Math.round(viewH*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);S.vh=viewH/viewW*400;}
function reset(){const vh=S.vh;init(S);S.vh=vh||600;clearInput();}
const heldKeys=new Set(),heldPointers=new Map(),keyMap={ArrowLeft:'esq',KeyA:'esq',ArrowRight:'dir',KeyD:'dir',Space:'pulo',KeyW:'pulo',ArrowUp:'pulo'};
reset();new ResizeObserver(resize).observe(canvas);resize();
function syncInput(){for(const name of Object.keys(input))input[name]=[...heldKeys].some(k=>keyMap[k]===name)||[...heldPointers.values()].includes(name);document.querySelectorAll('[data-control]').forEach(b=>b.classList.toggle('held',input[b.dataset.control]));}
function clearInput(){if(typeof heldKeys!=='undefined')heldKeys.clear();if(typeof heldPointers!=='undefined')heldPointers.clear();for(const key in input)input[key]=false;document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'));}
function startGame(){reset();S.mode='play';last=performance.now();renderHUD();canvas.focus({preventScroll:true});}
canvas.tabIndex=0;
document.getElementById('start').addEventListener('click',startGame);
addEventListener('keydown',e=>{if(!keyMap[e.code])return;if(e.target instanceof HTMLButtonElement&&S.mode!=='play')return;e.preventDefault();heldKeys.add(e.code);syncInput();});
addEventListener('keyup',e=>{if(keyMap[e.code]){e.preventDefault();heldKeys.delete(e.code);syncInput();}});
document.querySelectorAll('[data-control]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);heldPointers.set(e.pointerId,b.dataset.control);syncInput();});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{heldPointers.delete(e.pointerId);syncInput();});b.addEventListener('contextmenu',e=>e.preventDefault());});
addEventListener('blur',()=>{clearInput();last=0;});document.addEventListener('visibilitychange',()=>{clearInput();last=0;});
function renderHUD(){document.getElementById('height').textContent=Math.max(0,Math.floor(-S.p.y))+' m';document.getElementById('record').textContent='Máxima: '+Math.floor(S.alturaMax)+' m';document.getElementById('stage').textContent=names[S.estagio];const screen=document.getElementById('screen');screen.hidden=S.mode==='play';if(S.mode==='over'){document.getElementById('eyebrow').textContent='Fim da jornada';document.getElementById('heading').textContent='Você chegou longe.';document.getElementById('message').textContent='Altura alcançada: '+Math.floor(S.alturaMax)+' m. Respire e tente subir mais uma vez.';document.getElementById('start').textContent='Reiniciar';}}
function frame(now){const dt=Math.max(0,Math.min(last?(now-last)/1000:0,.033));last=now;if(S.mode==='play')update(S,dt,input);draw(ctx,S,viewW,viewH,SPR);renderHUD();requestAnimationFrame(frame);}
